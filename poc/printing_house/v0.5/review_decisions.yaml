document:
  id: printing_house_catalog_v05_review_decisions
  title: "Printing House - katalogski podskup - review decisions"
  pipeline_version: "0.5"
  requirement_atoms_file: "requirement_atoms.yaml"
  description: "Simulirane review odluke za katalogski PoC."

review_state:
  status: simulated_review_complete
  reviewed_at: "2026-08-24"
  reviewed_by: simulated_v05_review
  decision_policy: accept_recommended_catalog_scope_options
  pending_decisions: []

review_decisions:
  - id: PH-RD-001
    question: "Da li u katalogskom PoC-u modelovati korisnicki nalog stampara ili samo stampariju kao vlasnika kataloga?"
    affected_atoms: [PH-RA-003]
    options:
      - id: print_shop_only
        recommended: true
        rationale: "Podskup je katalogski i ne obuhvata autentifikaciju, pa je PrintShop dovoljan vlasnik kataloga."
      - id: include_printer_account
        recommended: false
        rationale: "Korisno za full sistem, ali prosiruje scope van v0.5 probe."
    decision:
      status: accepted_with_assumption
      selected_option: print_shop_only
      rationale: "Modeluje se PrintShop; korisnicki nalog stampara ostaje van ovog podskupa."

  - id: PH-RD-002
    question: "Kako modelovati kategorije, potkategorije i pripadnost proizvoda?"
    affected_atoms: [PH-RA-006, PH-RA-008]
    options:
      - id: normalized_two_level_taxonomy
        recommended: true
        rationale: "Tekst eksplicitno razlikuje kategorije i potkategorije; relacioni model treba da ih normalizuje."
      - id: text_fields_on_product
        recommended: false
        rationale: "Brze je, ali gubi normalizaciju i veze."
    decision:
      status: accepted_with_assumption
      selected_option: normalized_two_level_taxonomy
      rationale: "Koriste se Category i Subcategory, a Product pripada tacno jednoj Subcategory."

  - id: PH-RD-003
    question: "U kom opsegu je jedinstvena sifra proizvoda?"
    affected_atoms: [PH-RA-010]
    options:
      - id: unique_per_print_shop
        recommended: true
        rationale: "Sifra proizvoda je poslovni identifikator u katalogu konkretne stamparije."
      - id: globally_unique
        recommended: false
        rationale: "Prestrogo ako razlicite stamparije imaju interne sifre."
      - id: no_unique_constraint
        recommended: false
        rationale: "Preslabo jer tekst sifru predstavlja kao identifikator."
    decision:
      status: accepted_with_assumption
      selected_option: unique_per_print_shop
      rationale: "Product.code je jedinstven u okviru PrintShop."

  - id: PH-RD-004
    question: "Koja osnovna tekstualna polja proizvoda su obavezna?"
    affected_atoms: [PH-RA-011]
    options:
      - id: name_required_description_optional
        recommended: true
        rationale: "Naziv je potreban za katalogski prikaz, a tekst eksplicitno dozvoljava prazan opis."
      - id: name_and_description_required
        recommended: false
        rationale: "Opis je koristan, ali nije obavezan u ovom podskupu."
    decision:
      status: accepted
      selected_option: name_required_description_optional
      rationale: "Product.name je required, Product.description nije required."

  - id: PH-RD-005
    question: "Kako modelovati slike proizvoda?"
    affected_atoms: [PH-RA-014]
    options:
      - id: product_image_url_entity
        recommended: true
        rationale: "Tekst govori o glavnoj i dodatnim slikama; URL/reference su dovoljne za ovaj podskup."
      - id: product_file_upload_spec
        recommended: false
        rationale: "Upload/storage semantika pripada full zadatku, ne ovom katalogskom podskupu."
      - id: inline_main_image_only
        recommended: false
        rationale: "Ne podrzava dodatne slike."
    decision:
      status: accepted_with_assumption
      selected_option: product_image_url_entity
      rationale: "Koristi se ProductImage sa image_url i is_primary."

  - id: PH-RD-006
    question: "Da li dodatna cena i dimenzije usluge pripadaju PrintService ili vezi ProductPrintService?"
    affected_atoms: [PH-RA-016, PH-RA-017, PH-RA-018]
    options:
      - id: association_level_attributes
        recommended: true
        rationale: "Polja su u JSON-u ugnjezdena pod proizvodom, pa mogu zavisiti od konkretne ponude usluge za proizvod."
      - id: service_level_attributes
        recommended: false
        rationale: "Jednostavnije je, ali pretpostavlja da je cena usluge globalna."
    decision:
      status: accepted_with_assumption
      selected_option: association_level_attributes
      rationale: "PrintService cuva code/name, a ProductPrintService cuva additional_price i dimenzije."

  - id: PH-RD-007
    question: "Kako tretirati izvorno JSON polje stampaorijaId?"
    affected_atoms: [PH-RA-004, PH-RA-020]
    options:
      - id: normalize_to_print_shop_code
        recommended: true
        rationale: "Izvorni naziv se cuva kao source_field, ali model dobija citljiv atribut PrintShop.code."
      - id: preserve_typo_as_attribute
        recommended: false
        rationale: "Forenzicki verno, ali lose za model i generisane artefakte."
    decision:
      status: accepted_with_assumption
      selected_option: normalize_to_print_shop_code
      rationale: "stampaorijaId se mapira na PrintShop.code uz sacuvan source_field."

  - id: PH-RD-008
    question: "Koja unique ogranicenja primeniti na kategorije i potkategorije?"
    affected_atoms: [PH-RA-006, PH-RA-021]
    options:
      - id: category_unique_subcategory_unique_per_category
        recommended: true
        rationale: "Category.name je jedinstven, a Subcategory.name je jedinstven u okviru Category."
      - id: no_taxonomy_unique_constraints
        recommended: false
        rationale: "Dozvoljava duplikate koji kvare katalog."
    decision:
      status: accepted_with_assumption
      selected_option: category_unique_subcategory_unique_per_category
      rationale: "Dodaju se Category.name unique i Subcategory(category_id, name) unique."

  - id: PH-RD-009
    question: "Da li delove van kataloga dodavati u DB-DSL kao placeholder-e?"
    affected_atoms: [PH-RA-002]
    options:
      - id: exclude_non_catalog_scope
        recommended: true
        rationale: "Trace treba da pokaze da su ovi delovi namerno izostavljeni, bez laznih tabela."
      - id: add_placeholder_entities
        recommended: false
        rationale: "Zamagljuje granicu PoC-a i slabi poredivost sa starim katalogskim v0.1."
    decision:
      status: accepted
      selected_option: exclude_non_catalog_scope
      rationale: "Van-scope pojmovi ostaju samo u trace/scope sloju."
