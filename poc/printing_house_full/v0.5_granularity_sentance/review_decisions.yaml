review_decisions:
    - id: PHF-RD-001
      question: Kako modelovati korisnicke uloge i institucionalne profile?
      affected_atoms:
        - PHF-RA-001
        - PHF-RA-006
      decision:
        rationale: Jedna tabela naloga sa rolom je jednostavnija i podrzava zajednicku autentifikaciju; pravna lica i stamparije se povezuju sa Institution.
        selected_option: single_user_account_with_role_and_optional_institution
        status: accepted_with_assumption
    - id: PHF-RD-002
      question: Da li cuvati sirovu lozinku ili samo hash i reset tokene?
      affected_atoms:
        - PHF-RA-002
        - PHF-RA-003
      decision:
        rationale: Tekst eksplicitno trazi kriptovanu lozinku; reset link ima rok od 5 minuta.
        selected_option: password_hash_and_expiring_reset_token
        status: accepted
    - id: PHF-RD-003
      question: Kako tretirati upload fajlove?
      affected_atoms:
        - PHF-RA-005
        - PHF-RA-009
        - PHF-RA-012
        - PHF-RA-016
        - PHF-RA-019
      decision:
        rationale: Baza cuva putanju/metapodatke, a fajlovi se skladiste van relacione tabele.
        selected_option: store_file_path_and_validation_metadata
        status: accepted_with_assumption
    - id: PHF-RD-004
      question: Da li kategorije i potkategorije normalizovati?
      affected_atoms:
        - PHF-RA-023
        - PHF-RA-030
      decision:
        rationale: Tekst govori o predefinisanim kategorijama/potkategorijama i administratorskom upravljanju.
        selected_option: normalized_category_subcategory_tables
        status: accepted
    - id: PHF-RD-005
      question: Kako modelovati usluge stampe po proizvodu?
      affected_atoms:
        - PHF-RA-011
        - PHF-RA-023
      decision:
        rationale: Cena i maksimalne dimenzije zavise od veze proizvod-usluga; posto se izabrana usluga stampe referencira iz korpe i fakture, join entitet mora imati sopstveni identitet.
        selected_option: product_print_service_join_entity_with_price_dimensions_and_identity
        status: accepted
    - id: PHF-RD-006
      question: Sta je narudzbina u modelu?
      affected_atoms:
        - PHF-RA-010
        - PHF-RA-015
        - PHF-RA-026
      decision:
        rationale: Tekst koristi fakturu kao identifikator i statusni nosilac narudzbine.
        selected_option: invoice_as_order_per_print_shop
        status: accepted_with_assumption
    - id: PHF-RD-007
      question: Da li cuvati podatke kartice?
      affected_atoms:
        - PHF-RA-017
      decision:
        rationale: Card/CVC podaci idu eksternom sandbox servisu; baza cuva status i provider referencu.
        selected_option: store_payment_attempt_without_card_data
        status: accepted
    - id: PHF-RD-008
      question: Kako modelovati javne nabavke i ponude?
      affected_atoms:
        - PHF-RA-018
        - PHF-RA-019
        - PHF-RA-027
        - PHF-RA-028
      decision:
        rationale: Ponuda mora pokriti sve trazene proizvode i bira se najniza ukupna ponuda; stavka ponude zato referencira stavku nabavke, a poseban offered_product_id se ne uvodi jer tekst ne dozvoljava zamenske proizvode.
        selected_option: procurement_with_items_bids_and_bid_items_no_substitution_product
        status: accepted
    - id: PHF-RD-009
      question: Kako vezati like/dislike i komentar?
      affected_atoms:
        - PHF-RA-020
        - PHF-RA-021
      decision:
        rationale: Time se sprecava ocenjivanje proizvoda koji korisnik nije primio.
        selected_option: feedback_linked_to_received_invoice_item
        status: accepted_with_assumption
    - id: PHF-RD-010
      question: Da li statistike praviti kao tabele?
      affected_atoms:
        - PHF-RA-007
        - PHF-RA-031
      decision:
        rationale: Grafikoni su agregati nad fakturama, stavkama i feedback-om.
        selected_option: statistics_as_derived_views
        status: accepted
    - id: PHF-RD-011
      question: Kako modelovati statuse?
      affected_atoms:
        - PHF-RA-004
        - PHF-RA-015
        - PHF-RA-017
        - PHF-RA-018
        - PHF-RA-019
        - PHF-RA-020
        - PHF-RA-026
      decision:
        rationale: Statusi imaju ogranicene vrednosti i sekvence prelaza.
        selected_option: enum_fields_plus_state_machines
        status: accepted
