document:
    description: Matrica akter -> operacija -> trajni entitet za proveru da logicki model podrzava zahteve.
    functional_decomposition_file: functional_decomposition.yaml
    id: printing_house_full_v05_sentence_crud_matrix
    pipeline_version: "0.5"
    requirement_atoms_file: requirement_atoms.yaml
    title: Printing House full v0.5 sentence-granularity CRUD/ISUD matrix
notation:
    C: create/insert
    D: delete
    R: read/select
    U: update
actors:
    - id: unauthenticated_user
      label: Neregistrovani korisnik
      description: Korisnik koji nije prijavljen; vidi javnu pocetnu stranu, pretragu, detalje i forme za prijavu/registraciju/reset.
    - id: client
      label: Klijent
      description: Zajednicki akter za fizicka i pravna lica kada funkcionalnost nije specificna za podtip.
    - id: client_individual
      label: Klijent fizicko lice
      description: Klijent koji potvrdom korpe direktno formira fakture i opcionalno placa.
    - id: client_legal
      label: Klijent pravno lice
      description: Klijent/institucija koja potvrdom korpe pokrece javnu nabavku.
    - id: printer
      label: Stampar
      description: Korisnik stamparije koji upravlja katalogom, kolicinama, narudzbinama i ponudama.
    - id: administrator
      label: Administrator
      description: Privilegovani korisnik za korisnike, registracije, taksonomiju i statistike.
    - id: system
      label: Sistem
      description: Aplikaciona logika koja generise dokumente, zakljucuje javne nabavke i izvrsava izvedene operacije.
    - id: external_payment_provider
      label: Eksterni servis placanja
      description: Stripe/PayPal sandbox servis; ne modeluje se kao interna tabela.
operations:
