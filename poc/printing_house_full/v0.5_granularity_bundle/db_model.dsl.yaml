import_specs:
- id: PrintShopCatalogImport
  label: JSON import kataloga stamparije
  description: Import lager liste proizvoda, boja, slika i usluga stampe iz JSON fajla.
  format: json
  source:
    source_units:
    - PHF-SU-020
    - PHF-SU-021
    source_id: ph_catalog_json
    file: pia/raw/2025_2026/2025_2026_003_projektni_zadatak_za_avgustovski_i_septembarski_rok_za_skolsku_2025_2026_godine_mozete_preuzeti_ovde_minimalni_zahtevi_z.json
  root: "$"
  mappings:
  - source_path: "$.stampaorijaId"
    target: PrintShop.code
  - source_path: "$.nazivStamparije"
    target: PrintShop.display_name
  - source_path: "$.proizvodi[*].sifra"
    target: Product.code
  - source_path: "$.proizvodi[*].naziv"
    target: Product.name
  - source_path: "$.proizvodi[*].opis"
    target: Product.description
  - source_path: "$.proizvodi[*].kategorija"
    target: Category.name
  - source_path: "$.proizvodi[*].potkategorija"
    target: Subcategory.name
  - source_path: "$.proizvodi[*].jedinicnaCena"
    target: Product.unit_price
  - source_path: "$.proizvodi[*].kolicinaNaLageru"
    target: Product.stock_quantity
  - source_path: "$.proizvodi[*].dostupneBoje[*]"
    target: Color.name
  - source_path: "$.proizvodi[*].slikaUrl"
    target: ProductImage.storage_path
  - source_path: "$.proizvodi[*].dodatneSlike[*]"
    target: ProductImage.storage_path
  - source_path: "$.proizvodi[*].uslugeStampe[*].idUsluge"
    target: PrintService.code
  - source_path: "$.proizvodi[*].uslugeStampe[*].tipStampe"
    target: PrintService.name
  - source_path: "$.proizvodi[*].uslugeStampe[*].dodatnaCenaPoKomadu"
    target: ProductPrintService.additional_price
  - source_path: "$.proizvodi[*].uslugeStampe[*].maxSirinaMm"
    target: ProductPrintService.max_width_mm
  - source_path: "$.proizvodi[*].uslugeStampe[*].maxVisinaMm"
    target: ProductPrintService.max_height_mm
  evidence:
    source_units:
    - PHF-SU-008
    - PHF-SU-011
    - PHF-SU-013
    - PHF-SU-020
    - PHF-SU-021
    requirement_atoms:
    - PHF-RA-009
    review_decisions:
    - PHF-RD-004
    - PHF-RD-005
    support_level: explicit
    confidence: high
